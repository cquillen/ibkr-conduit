name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'tools/**'
              - '*.slnx'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - '.editorconfig'
              - '.github/workflows/**'

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Skip — docs-only change
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes detected — skipping build and test."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - name: Setup .NET SDKs
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Restore dependencies
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore

      - name: Check formatting
        if: needs.changes.outputs.code == 'true'
        run: dotnet format --verify-no-changes

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: dotnet build --no-restore --configuration Release

      # The single-file (file-based) example apps under examples/*.cs reference the
      # IbkrConduit project directly but are NOT part of the solution, so the solution
      # build above does not compile them. Build each so API/dependency changes that
      # break a documented example fail CI. (The example project in examples/ that IS
      # in the solution is already covered by the Build step.)
      - name: Build single-file example apps
        if: needs.changes.outputs.code == 'true'
        run: |
          shopt -s nullglob
          for app in examples/*.cs; do
            echo "::group::Building $app"
            dotnet build "$app" --configuration Release
            echo "::endgroup::"
          done

      # The tool projects under tools/*/ (ApiCapture, CaptureFlexQuery, IbkrConduit.Setup,
      # QueryAccount) reference the IbkrConduit project directly but are NOT part of the
      # solution, so the solution build above does not compile them. Build each so a
      # breaking API change that breaks a tool fails CI instead of silently rotting it —
      # exactly how QueryAccount and DiagnosticLst broke unnoticed. Build-only: the
      # IbkrConduit.Setup explicit KeyGenerator test suite stays opt-in (explicit-tests.md)
      # and a plain build does not run it.
      - name: Build tool projects
        if: needs.changes.outputs.code == 'true'
        run: |
          shopt -s nullglob
          for proj in tools/*/*.csproj; do
            echo "::group::Building $proj"
            dotnet build "$proj" --configuration Release
            echo "::endgroup::"
          done

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: dotnet test --no-build --configuration Release --filter-not-trait "Category=Slow"

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
